server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/shop_db
spring.datasource.username=root
spring.datasource.password=@2005liyR@dw@n
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Enable Feign CircuitBreaker support
feign.circuitbreaker.enabled=true

# Circuit Breaker config for Wallet Service
resilience4j.circuitbreaker.instances.walletService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.walletService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.walletService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.walletService.waitDurationInOpenState=10000ms

# Circuit Breaker config for Inventory Service
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventoryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryService.waitDurationInOpenState=10000ms